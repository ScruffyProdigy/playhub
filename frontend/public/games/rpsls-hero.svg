    <rect x="96" y="28" width="32" height="42" rx="4" fill="#fff" stroke="#d8dce8" stroke-width="1.5" transform="rotate(-6 112 49)"/>
    <!-- Scissors -->
    <circle cx="192" cy="52" r="28" fill="rgba(255,255,255,0.08)"/>
    <path d="M178 36l14 18-8 6-10-14 4-10z" fill="#e8ecf4" stroke="#aab2c8" stroke-width="1.5"/>
    <circle cx="198" cy="58" r="5" fill="none" stroke="#aab2c8" stroke-width="2"/>
    <circle cx="208" cy="66" r="5" fill="none" stroke="#aab2c8" stroke-width="2"/>
    <path d="M198 58l10 8" stroke="#aab2c8" stroke-width="2" stroke-linecap="round"/>
    <!-- Lizard -->
