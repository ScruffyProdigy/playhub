  </defs>
  <rect width="400" height="160" fill="url(#rps-hero-bg)"/>
  <ellipse cx="200" cy="88" rx="168" ry="52" fill="rgba(255,255,255,0.06)"/>
  <g transform="translate(44 42)">
    <!-- Rock -->
    <circle cx="32" cy="52" r="28" fill="rgba(255,255,255,0.08)"/>
    <path d="M16 62c0-10 6-20 16-24 4-2 9-2 13 0 8 5 13 15 13 26v8H16v-10z" fill="#f0c9a6" stroke="#c9956d" stroke-width="1.5"/>
