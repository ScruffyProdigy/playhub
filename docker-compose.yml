# Shared PostgreSQL for local development and test scripts.
# Credentials match k8s/secrets/*.example.yaml and CI service containers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-pass
      POSTGRES_DB: playhub
    ports:
      - "5432:5432"
    volumes:
      - playhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d playhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  playhub_pgdata:
