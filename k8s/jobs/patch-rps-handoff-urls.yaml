# One-shot: point the seeded RPS catalog row at production game URLs (GKE).
apiVersion: batch/v1
kind: Job
metadata:
  name: lobby-patch-rps-handoff-urls
  namespace: playhub
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: patch
          image: postgres:16-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pg-dsn
                  key: DATABASE_URL
          command:
            - sh
            - -ec
            - |
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
              UPDATE games
              SET play_url = 'https://rpsls-duel.win',
                  api_base_url = 'https://rpsls-duel.win/api'
              WHERE slug = 'rock-paper-scissors-lizard-spock'
                 OR id = 'a1000000-0000-4000-8000-000000000001';
              "
