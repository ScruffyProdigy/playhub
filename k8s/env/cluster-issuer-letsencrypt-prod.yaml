# Cluster-wide (not namespaced). On GKE Autopilot, run scripts/patch-cert-manager-gke.sh after install.
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.5/cert-manager.yaml
#   ./scripts/patch-cert-manager-gke.sh
#   kubectl apply -f k8s/env/cluster-issuer-letsencrypt-prod.yaml
#
# Change spec.acme.email to an address you monitor (Let's Encrypt expiry notices).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ryan.c.kohler@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
