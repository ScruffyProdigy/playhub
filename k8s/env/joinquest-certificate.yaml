# TLS cert for joinquest.cc (cert-manager). Secret is referenced by joinquest-ingress.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: joinquest-cc
  namespace: joinquest
spec:
  secretName: joinquest-cc-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - joinquest.cc
