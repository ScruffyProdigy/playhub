# Auth peppers for Lobby (magic-link hashing + per-game service tokens).
#
# Setup:
#   cp k8s/secrets/lobby-auth-peppers.example.yaml k8s/secrets/lobby-auth-peppers.yaml
#
# Generate two different secrets (run twice, paste each into its key):
#   openssl rand -base64 32
#
# Edit lobby-auth-peppers.yaml: set metadata.namespace, replace the two CHANGE_ME values.
# Do not commit lobby-auth-peppers.yaml (gitignored).
apiVersion: v1
kind: Secret
metadata:
  name: lobby-auth-peppers
  namespace: joinquest
type: Opaque
stringData:
  MAGIC_LINK_PEPPER: "CHANGE_ME_MAGIC_LINK"
  LOBBY_GAME_TOKEN_PEPPER: "CHANGE_ME_GAME_TOKEN"
