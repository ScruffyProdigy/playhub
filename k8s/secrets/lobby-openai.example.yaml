# Copy to lobby-openai.yaml (gitignored). Or:
#   kubectl create secret generic lobby-openai -n joinquest --from-literal=OPENAI_API_KEY='sk-...'
apiVersion: v1
kind: Secret
metadata:
  name: lobby-openai
  namespace: joinquest
type: Opaque
stringData:
  OPENAI_API_KEY: REPLACE_WITH_OPENAI_API_KEY
  OPENAI_IMAGE_MODEL: gpt-image-1
  OPENAI_IMAGE_QUALITY: medium
  # OPENAI_CHAT_MODEL: gpt-4o-mini
