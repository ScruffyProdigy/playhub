# Copy to lobby-oauth.yaml (gitignored). Register redirect URIs:
#   https://joinquest.cc/auth/oauth/google/callback
#   https://joinquest.cc/auth/oauth/discord/callback
# Local dev: http://localhost:8080/auth/oauth/{google,discord}/callback
apiVersion: v1
kind: Secret
metadata:
  name: lobby-oauth
  namespace: joinquest
type: Opaque
# Quote all stringData values (Discord client IDs are numeric).
stringData:
  GOOGLE_OAUTH_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_OAUTH_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  DISCORD_OAUTH_CLIENT_ID: "REPLACE_WITH_DISCORD_CLIENT_ID"
  DISCORD_OAUTH_CLIENT_SECRET: "REPLACE_WITH_DISCORD_CLIENT_SECRET"
