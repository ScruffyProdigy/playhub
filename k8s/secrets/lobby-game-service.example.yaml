# Shared token for Lobby ↔ game server-to-server calls (provision + player lookup).
# Copy to lobby-game-service.yaml (gitignored). Games receive this value as lobby.serviceToken on provision.
apiVersion: v1
kind: Secret
metadata:
  name: lobby-game-service
  namespace: joinquest
type: Opaque
stringData:
  LOBBY_GAME_SERVICE_TOKEN: "CHANGE_ME"
