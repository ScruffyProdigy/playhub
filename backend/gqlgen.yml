schema:
  - graph/schema/*.graphqls
exec:
  filename: graph/generated/generated.go
  package: generated
model:
  filename: graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: graph
  package: graph
models:
  UUID:
    model: [github.com/google/uuid.UUID]
  JSON:
    model: [github.com/99designs/gqlgen/graphql.Map]
  Game:
    fields:
      activeSessions:
        resolver: true
      modes:
        resolver: true
  GameMode:
    fields:
      seats:
        resolver: true
      queuePaths:
        resolver: true
      queues:
        resolver: true
  ModeQueue:
    fields:
      waitingCount:
        resolver: true
  Session:
    fields:
      game:
        resolver: true
      players:
        resolver: true
  User:
    fields:
      isAdmin:
        resolver: true
